<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | MAKLAID</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #152137;
        color: #e4e9f1;
        font-family: 'Inter', sans-serif;
        text-align: center;
        padding: 2rem;
      }

      .code {
        font-family: 'Playfair Display', serif;
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 800;
        color: #c9a227;
        line-height: 1;
      }

      h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 600;
        margin-top: 1rem;
        color: #ffffff;
      }

      p {
        margin-top: 0.75rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #9daecb;
        max-width: 28rem;
      }

      .home-link {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        background-color: #c9a227;
        color: #0c1526;
        font-family: 'Inter', sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0.5rem;
        transition: background-color 0.2s;
      }

      .home-link:hover {
        background-color: #d5b444;
      }

      .home-link:focus-visible {
        outline: 2px solid #c9a227;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="code" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="home-link">Back to Home</a>
  </body>
</html>
